name: Build iOS (non firmata)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila senza firma
        run: |
          xcodebuild \
            -project ObdDash.xcodeproj \
            -scheme ObdDash \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crea il file .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ObdDash.app Payload/
          zip -qr ObdDash.ipa Payload

      - name: Pubblica il file .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ObdDash-ipa
          path: ObdDash.ipa
          retention-days: 30
