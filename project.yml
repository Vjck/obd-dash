name: ObdDash
options:
  bundleIdPrefix: com.obddash
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "0.5.3"
    CURRENT_PROJECT_VERSION: "9"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ObdDash:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    scheme: {}
    dependencies:
      - target: ObdDashWidgets
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: OBD Dash
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: "Serve per collegarsi al lettore OBD II dell'auto."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obddash.app
  ObdDashWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: OBD Dash
        CFBundleDevelopmentRegion: it
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.obddash.app.widgets
